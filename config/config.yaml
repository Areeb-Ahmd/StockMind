vector_db:
  index_name: "agentic-trading-bot-vdb"

ingestion:
  batch_size: 40
  delay_between_batches: 5.0
  max_retries: 5
  retry_initial_delay: 10.0


retriever:
  top_k: 3
  score_threshold: 0.5

embedding_model:
  provider: "google"
  model_name: "models/gemini-embedding-001"

llm:
  primary:
    provider: "google"
    model_name: "gemini-3.1-flash-lite"
  fallback:
    provider: "groq"
    model_name: "openai/gpt-oss-120b"



tools:
  tavily:
    max_results: 5