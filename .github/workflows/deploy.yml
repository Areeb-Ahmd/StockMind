name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: stockmind-repo
  BACKEND_IMAGE_NAME: stockmind-backend
  FRONTEND_IMAGE_NAME: stockmind-frontend

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ==========================================
      # Build & Push Backend Docker Image
      # ==========================================
      - name: Build & Push Backend Image
        run: |
          BACKEND_IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE_NAME }}"
          docker build -t ${BACKEND_IMAGE_TAG}:${{ github.sha }} -t ${BACKEND_IMAGE_TAG}:latest ./backend
          docker push ${BACKEND_IMAGE_TAG}:${{ github.sha }}
          docker push ${BACKEND_IMAGE_TAG}:latest

      # ==========================================
      # Deploy Backend Service to Cloud Run
      # ==========================================
      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_IMAGE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest,POLYGON_API_KEY=POLYGON_API_KEY:latest

      # ==========================================
      # Build & Push Frontend Docker Image
      # ==========================================
      - name: Build & Push Frontend Image
        run: |
          FRONTEND_IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE_NAME }}"
          docker build -t ${FRONTEND_IMAGE_TAG}:${{ github.sha }} -t ${FRONTEND_IMAGE_TAG}:latest ./frontend
          docker push ${FRONTEND_IMAGE_TAG}:${{ github.sha }}
          docker push ${FRONTEND_IMAGE_TAG}:latest

      # ==========================================
      # Deploy Frontend Service to Cloud Run
      # ==========================================
      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_IMAGE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          env_vars: |
            BACKEND_URL=${{ steps.deploy-backend.outputs.url }}
          flags: |
            --allow-unauthenticated
            --port=8501
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
